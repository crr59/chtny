<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Unicorn</title>

<style>

:root{
  --bg:#F4F1F8;
}

body{
  margin:0;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  overflow:hidden;
}

/* container */
.hero{
  width:min(70vw,700px);
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* unicorn image */
.hero img{
  width:100%;
  height:auto;
  animation: float 6s ease-in-out infinite;
}

/* subtle floating motion */
@keyframes float{
  0%,100%{
    transform:translateY(0px);
  }
  50%{
    transform:translateY(-12px);
  }
}

/* accessibility */
@media (prefers-reduced-motion: reduce){
  .hero img{
    animation:none;
  }
}

</style>
</head>

<body>

<div class="hero">
  <img src="unicorn.png" alt="Sassy unicorn astronaut icon">
</div>

</body>
</html>
